name: C/C++ CI

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
    linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6.0.1
            - name: Install Conan
              uses: turtlebrowser/get-conan@main
              with:
                version: 2.25.2
            - name: Configure conan
              run: conan profile detect
            - name: Install deps
              run: conan install . --output-folder=${{github.workspace}}/build --build=missing -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True
            - name: "Configure and build"
              run: cmake -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake -DUSE_CONAN=ON -DCMAKE_BUILD_TYPE=Release -S . -B build
            - name: build
              run: cmake --build build --config Release
            - name: package
              run: cmake --build build --config Release --target package
            - uses: actions/upload-artifact@v4
              with:
                name: ubuntu
                path: build/Li_ri-*.sh
    mac:
        runs-on: macos-15
        steps:
            - uses: actions/checkout@v6.0.1
            - uses: actions/setup-python@v6.1.0
              with:
                python-version: '3.13'
            - name: Get Conan
              uses: turtlebrowser/get-conan@main
              with:
                version: 2.25.2
            - name: Configure conan
              run: conan profile detect
            - name: Install deps
              run: conan install . --output-folder=${{github.workspace}}/build --build=missing

            - name: "Configure and build"
              run: cmake -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake -DUSE_CONAN=ON -DCMAKE_BUILD_TYPE=Release -S . -B build
            - name: build
              run: cmake --build build --config Release
            - name: verify app bundle
              run: |
                test -x build/Li-ri.app/Contents/MacOS/Li-ri
                test -f build/Li-ri.app/Contents/Resources/sprites.dat
                test -f build/Li-ri.app/Contents/Resources/Sounds/click.wav
                test -f build/Li-ri.app/Contents/Resources/Li-ri.icns
                plutil -lint build/Li-ri.app/Contents/Info.plist
                otool -L build/Li-ri.app/Contents/MacOS/Li-ri
            - name: package
              run: cmake --build build --config Release --target package
            - name: verify dmg
              run: |
                # The dmg shows the GPL license agreement; accept it non-interactively
                yes | hdiutil attach build/Li_ri-*.dmg -mountpoint /tmp/liri -nobrowse
                test -f /tmp/liri/Li-ri.app/Contents/Resources/sprites.dat
                codesign --verify --deep --strict /tmp/liri/Li-ri.app
                hdiutil detach /tmp/liri
            - uses: actions/upload-artifact@v4
              with:
                name: macOS
                path: build/Li_ri-*.dmg

    windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v6.0.1
            - name: Install Conan
              uses: turtlebrowser/get-conan@main
              with:
                version: 2.25.2

            - name: Configure conan
              run: |
                conan profile detect
                # windows-latest ships Visual Studio 2026; some recipes (sdl_mixer) pin a
                # CMake < 4.2, which has no "Visual Studio 18 2026" generator.
                printf '\n[replace_tool_requires]\ncmake/*: cmake/4.2.1\n' >> "$(conan profile path default)"
                cat "$(conan profile path default)"
            - name: Install deps
              run: conan install . --output-folder=${{github.workspace}}/build --build=missing
            - name: "Configure and build"
              run: cmake -DCMAKE_TOOLCHAIN_FILE="${{github.workspace}}/build/build/generators/conan_toolchain.cmake" -DUSE_CONAN=ON -DCMAKE_BUILD_TYPE=Release -S . -B build

            - name: build
              run: cmake --build build --config Release
            - name: Install NSIS
              # repolevedavaj/install-nsis downloads from a fixed SourceForge mirror
              # that now serves a corrupted installer; use Chocolatey instead.
              shell: pwsh
              run: |
                choco install nsis -y --no-progress
                "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
            - name: package
              run: cmake --build build --config Release --target package
            - uses: actions/upload-artifact@v4
              with:
                name: windows
                path: build/Li_ri-*.exe
